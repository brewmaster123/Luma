name: Luma - iPhone and Apple Watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Luma
    runs-on: macos-15
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    defaults:
      run:
        shell: bash
        working-directory: Luma

    steps:
      - name: Download source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check project and tools
        run: |
          mkdir -p ../build-logs
          test -f Package.swift
          test -f Luma.xcodeproj/project.pbxproj
          xcodebuild -version
          swift --version

      - name: Run core tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../build-logs/core-tests.log

      - name: Build Apple Watch app
        run: |
          set -o pipefail
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme "Luma Watch" \
            -configuration Debug \
            -destination "generic/platform=watchOS" \
            -derivedDataPath ../build/watch \
            -resultBundlePath ../build-logs/watch.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build-logs/watch-build.log

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/iphone \
            -resultBundlePath ../build-logs/iphone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build-logs/iphone-build.log

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Luma-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
