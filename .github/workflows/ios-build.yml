name: Luma - iPhone AlarmKit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Luma
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: Luma
    steps:
      - name: Download source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check project and tools
        id: project
        run: |
          set -euo pipefail
          mkdir -p ../build-logs
          test -f Package.swift
          test -f Luma.xcodeproj/project.pbxproj
          xcodebuild -version
          swift --version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Check native project structure
        id: structure
        run: python3 scripts/check-static.py

      - name: Run core tests
        id: core
        run: |
          set -euo pipefail
          swift test 2>&1 | tee ../build-logs/core-tests.log

      - name: Verify audio import with AVFoundation
        id: audio
        if: ${{ !cancelled() && steps.project.outcome == 'success' && steps.structure.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash scripts/check-audio-on-mac.sh 2>&1 | tee ../build-logs/audio-import.log

      - name: Build iPhone app
        id: iphone
        if: ${{ !cancelled() && steps.project.outcome == 'success' && steps.structure.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/iphone \
            -resultBundlePath ../build-logs/iphone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee ../build-logs/iphone-build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          LUMA_APP="../build/iphone/Build/Products/Debug-iphoneos/Luma.app"
          test -f "$LUMA_APP/Luma"
          test -f "$LUMA_APP/Info.plist"
          test ! -d "$LUMA_APP/Watch"
          test -f "$LUMA_APP/Manrope-Regular.ttf"
          test -f "$LUMA_APP/luma-tone-4.wav"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$LUMA_APP/Info.plist")" = "iPhoneOS"
          /usr/bin/lipo -verify_arch arm64 "$LUMA_APP/Luma"
          mkdir -p ../dist/Payload
          ditto "$LUMA_APP" ../dist/Payload/Luma.app
          (
            cd ../dist
            zip -q -r -y Luma-unsigned.ipa Payload
            unzip -tq Luma-unsigned.ipa
          )

      - name: Downloadable IPA
        uses: actions/upload-artifact@v7
        with:
          path: dist/Luma-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Luma-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
